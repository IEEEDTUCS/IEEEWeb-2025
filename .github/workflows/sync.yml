name: Sync from Main Repo

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'  # every hour as fallback
  workflow_dispatch:      # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream and force sync
        run: |
          git remote add upstream https://github.com/IEEEDTUCS/IEEEWeb-2025.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
