name: Sync Fork on Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git remote add fork https://x-access-token:${FORK_TOKEN}@github.com/ieeedtucs123/IEEEWeb-2025.git
          git push fork main --force
